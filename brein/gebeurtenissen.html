<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amber — gebeurtenissen</title><style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #080b1e; color: #d8dde5; padding: 16px 16px 40px;
         font-family: system-ui, -apple-system, sans-serif; max-width: 620px;
         margin: 0 auto; padding-top: calc(16px + env(safe-area-inset-top)); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  nav a { padding: 8px 13px; border-radius: 9px; font-size: 13px;
          color: #8ea0c0; text-decoration: none; background: #0c1230;
          border: 1px solid #1d2b4d; }
  nav a.hier { color: #cfe2ff; border-color: #3d5285; }
  h1 { font-size: 14px; letter-spacing: .28em; color: #5f6f92;
       text-transform: uppercase; font-weight: 600; margin: 4px 0 12px; }
  .kaart { background: #0c1230; border: 1px solid #1d2b4d;
           border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .kop { font-size: 10.5px; letter-spacing: .18em; color: #51608a;
         text-transform: uppercase; margin-bottom: 8px; }
  .rij { display: flex; justify-content: space-between; padding: 4px 0;
         font-size: 14px; color: #8ea0c0;
         font-variant-numeric: tabular-nums; }
  .rij b { color: #cfe2ff; font-weight: 600; }
  .goed { color: #7fe0c3; } .slecht { color: #ffa385; }
  .fijn { font-size: 12px; color: #51608a; }
  audio { width: 100%; height: 32px; margin-top: 8px; }
  .knop { display: inline-block; padding: 10px 15px; margin-top: 10px;
          background: #131b3e; color: #cfe2ff; border: 1px solid #2c3a5e;
          border-radius: 10px; font-size: 14px; cursor: pointer; }
</style>
<style>
  .lijn { border-left: 2px solid #1d2b4d; margin-left: 8px;
          padding-left: 16px; }
  .punt { position: relative; padding: 8px 0 14px; }
  .punt::before { content: ""; position: absolute; left: -21.5px; top: 14px;
                  width: 9px; height: 9px; border-radius: 50%;
                  background: #5ca8ff; }
  .punt.doorbraak::before { background: #7fe0c3; }
  .punt .w { font-size: 11px; color: #51608a;
             font-family: ui-monospace, monospace; }
  .punt .t { font-size: 14px; color: #d8dde5; line-height: 1.5;
             margin-top: 2px; }
</style></head><body>
<nav><a href="/">venster</a><a href="/dagbericht">dagbericht</a><a href="/machines">machines</a><a href="/gebeurtenissen" class=hier>gebeurtenissen</a><a href="/opname">oren</a><a href="/geheugen">geheugen</a><a href="/vraag">vraag haar</a></nav>
<h1>Gebeurtenissen</h1>
<div class="lijn" id="lijn">laden…</div>
<script>
async function haal() {
  try {
    const vast = (await (await fetch("/rapport/gebeurtenissen.json",
                                     {cache: "no-store"})).json()).vast;
    const s = await (await fetch("/stand.json", {cache: "no-store"})).json();
    const db = ((s.run && s.run.doorbraken) || []).map(d => ({
      wanneer: "vandaag", doorbraak: true,
      wat: `Doorbraak: ${d.familie} open tot diepte ${d.tot} (stap ${d.stap.toLocaleString("nl")})`}));
    const alles = vast.concat(db).reverse();
    document.getElementById("lijn").innerHTML = alles.map(g =>
      `<div class="punt${g.doorbraak ? " doorbraak" : ""}">
       <div class="w">${g.wanneer}</div>
       <div class="t">${g.wat}</div></div>`).join("");
  } catch (e) {}
}
haal(); setInterval(haal, 10000);
</script></body></html>
