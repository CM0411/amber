<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amber — dagbericht</title><style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #080b1e; color: #d8dde5; padding: 16px 16px 40px;
         font-family: system-ui, -apple-system, sans-serif; max-width: 620px;
         margin: 0 auto; padding-top: calc(16px + env(safe-area-inset-top)); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  nav a { padding: 8px 13px; border-radius: 9px; font-size: 13px;
          color: #8ea0c0; text-decoration: none; background: #0c1230;
          border: 1px solid #1d2b4d; }
  nav a.hier { color: #cfe2ff; border-color: #3d5285; }
  h1 { font-size: 14px; letter-spacing: .28em; color: #5f6f92;
       text-transform: uppercase; font-weight: 600; margin: 4px 0 12px; }
  .kaart { background: #0c1230; border: 1px solid #1d2b4d;
           border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .kop { font-size: 10.5px; letter-spacing: .18em; color: #51608a;
         text-transform: uppercase; margin-bottom: 8px; }
  .rij { display: flex; justify-content: space-between; padding: 4px 0;
         font-size: 14px; color: #8ea0c0;
         font-variant-numeric: tabular-nums; }
  .rij b { color: #cfe2ff; font-weight: 600; }
  .goed { color: #7fe0c3; } .slecht { color: #ffa385; }
  .fijn { font-size: 12px; color: #51608a; }
  audio { width: 100%; height: 32px; margin-top: 8px; }
  .knop { display: inline-block; padding: 10px 15px; margin-top: 10px;
          background: #131b3e; color: #cfe2ff; border: 1px solid #2c3a5e;
          border-radius: 10px; font-size: 14px; cursor: pointer; }
</style></head><body>
<nav><a href="/">venster</a><a href="/dagbericht" class=hier>dagbericht</a><a href="/machines">machines</a><a href="/gebeurtenissen">gebeurtenissen</a><a href="/opname">oren</a></nav>
<h1>Dagbericht</h1>
<div class="kaart"><div class="kop" id="d-kop">vandaag</div>
  <div id="d-tekst" style="font-size:14.5px;line-height:1.6">nog geen dagbericht…</div>
  <audio controls preload="none" id="d-audio" style="display:none"></audio>
  <div class="knop" id="d-nieuw">🔊 maak nu een vers dagbericht</div>
  <div class="fijn" style="margin-top:6px">elke avond om 21:00 spreekt ze er
  vanzelf één in</div></div>
<div class="kop" style="margin:18px 0 8px">eerdere dagen</div>
<div id="archief"><p class="fijn">nog geen archief…</p></div>
<script>
async function haal() {
  try {
    const m = await (await fetch("/rapport/dagbericht.json",
                                 {cache: "no-store"})).json();
    document.getElementById("d-tekst").textContent = m.tekst;
    const dag = new Date(m.tijd * 1000);
    document.getElementById("d-kop").textContent =
      dag.toLocaleString("nl", {weekday: "long", day: "numeric",
                                month: "long", hour: "2-digit",
                                minute: "2-digit"});
    const a = document.getElementById("d-audio");
    a.style.display = "block";
    if (!a.src.includes(m.tijd)) a.src = "/rapport/dagbericht.wav?" + m.tijd;
  } catch (e) {}
  try {
    const arch = await (await fetch("/rapport/dagberichten.json",
                                    {cache: "no-store"})).json();
    const el = document.getElementById("archief");
    if ((arch.dagen || []).length)
      el.innerHTML = arch.dagen.slice().reverse().map(d =>
        `<div class="kaart"><div class="kop">${d.dag}</div>
         <div style="font-size:13.5px;line-height:1.55">${d.tekst}</div>
         <audio controls preload="none" src="/rapport/${d.wav}"></audio>
         </div>`).join("");
  } catch (e) {}
}
haal(); setInterval(haal, 5000);
document.getElementById("d-nieuw").onclick = async (e) => {
  e.target.textContent = "🔊 ze formuleert en spreekt in…";
  await fetch("/dagbericht-nu");
  setTimeout(() => e.target.textContent = "🔊 maak nu een vers dagbericht",
             30000);
};
</script></body></html>
