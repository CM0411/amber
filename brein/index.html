<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Amber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* Het brein-venster, verbouwd op 24 aug 2026 (Cley: "naar je eigen smaak,
     maak het van deze tijd"). Dezelfde motor als daarvoor — het weefsel
     naar Cleys filmpje van 9 aug (groen is echt plus, rood is echt min in
     haar gewichten, golven en vonkjes, nooit een flits), alle tekst ónder
     de band (14 en 18 aug), de hekken uit run.json — maar een nieuwe jas:
     één rustig donker thema, grote getallen bovenin, leesbare letters
     (Atkinson Hyperlegible is ontworpen om te lezen, ook met dyslexie),
     tabelcijfers, en ruimte. */
  :root {
    --bg: #070A14; --surface: #0D1220; --surface-2: #131A2C; --line: #1E2740;
    --ink: #E6EBF5; --muted: #8C97B0; --dim: #5B667F;
    --mint: #7FE0C3; --coral: #FF9A7A; --sky: #6FB5FF; --lilac: #F0A8FF; --amber: #FFC272;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --tekst: "Atkinson Hyperlegible", system-ui, "Segoe UI", sans-serif;
    --r: 14px;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); overflow-x: hidden; overflow-y: auto;
         font-family: var(--tekst); font-size: 15px; line-height: 1.6;
         font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  button, input { font: inherit; }

  /* ---- kop ---- */
  #bovenbalk { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
               padding: 10px clamp(14px, 2vw, 28px); background: rgba(7, 10, 20, .78);
               backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
               border-bottom: 1px solid var(--line); }
  #titel { position: relative; font-family: var(--tekst); font-weight: 700; font-size: 17px;
           letter-spacing: .22em; text-transform: uppercase; color: var(--ink); cursor: pointer;
           user-select: none; display: inline-flex; align-items: center; gap: 8px; }
  #titel .pijl { display: inline-block; transition: transform .2s; color: var(--muted); letter-spacing: 0; font-size: 13px; }
  #titel.open .pijl { transform: rotate(180deg); }
  #menu { position: absolute; top: 48px; left: clamp(14px, 2vw, 28px); display: none; min-width: 290px;
          background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
          padding: 8px 0; font-size: 14px; z-index: 6; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  #menu.open { display: block; }
  #menu a { display: flex; justify-content: space-between; gap: 14px; padding: 8px 16px;
            color: var(--muted); text-decoration: none; }
  #menu a:hover { background: var(--surface-2); color: var(--ink); }
  #menu .st { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  #menu .st.lopend { color: var(--mint); }
  #uren { font-size: 12.5px; color: var(--dim); font-family: var(--mono); letter-spacing: .04em; }
  .pil { margin-left: auto; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
         padding: 5px 12px; border-radius: 100px; border: 1px solid var(--line); color: var(--muted);
         display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .pil::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .pil.aan { color: var(--mint); border-color: rgba(127,224,195,.35); }
  .pil.aan::before { background: var(--mint); box-shadow: 0 0 10px var(--mint); }
  .pil.uit { color: var(--amber); border-color: rgba(255,194,114,.35); }
  .pil.uit::before { background: var(--amber); }

  /* ---- het weefsel ---- */
  #doek { position: relative; display: block; width: 100vw; height: 58vh; z-index: 0; }

  /* ---- tegels: de getallen die tellen ---- */
  #stappen { display: grid; gap: 12px; padding: 0 clamp(12px, 1.5vw, 24px);
             grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
             margin-top: -6px; position: relative; z-index: 2; }
  #stappen:empty { display: none; }
  .tegel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
           padding: 14px 18px 14px; min-width: 0; }
  .tegel.tegel-stap { grid-column: span 2; }
  .tegel .label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
                  font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tegel .getal { margin-top: 4px; font-family: var(--mono); font-size: clamp(26px, 3vw, 36px);
                  font-weight: 700; color: var(--ink); line-height: 1.15; letter-spacing: -.01em;
                  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tegel .getal b { font-weight: 700; }
  .tegel .getal .van, .tegel .getal .eenheid { font-size: 14px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .tegel .sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
  .tegel .sub .live { color: var(--mint); }
  .tegel .balk { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
  .tegel .balk i { display: block; height: 100%; border-radius: 4px;
                   background: linear-gradient(90deg, var(--sky), var(--mint)); transition: width .8s linear; }
  .tegel.warm { border-color: rgba(255,154,122,.5); }
  .tegel.warm .getal b { color: var(--coral); }

  /* ---- kaarten ---- */
  #onder { position: relative; z-index: 2; padding: 14px clamp(12px, 1.5vw, 24px) 40px;
           display: grid; gap: 12px;
           grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
  .kaart:empty { display: none; }
  .kaart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
           padding: 16px 18px 18px; min-width: 0; color: var(--muted); line-height: 1.7; overflow-wrap: anywhere; }
  .kaart.breed { grid-column: 1 / -1; }
  .kaart .kop, .kaart .kopje { font-family: var(--mono); font-size: 11px; letter-spacing: .18em;
                               color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  .kaart b { color: var(--ink); font-weight: 700; }
  #status { font-size: 14px; color: var(--muted); line-height: 1.8; }
  #runkolom { display: flex; flex-direction: column; gap: 6px; }
  #runkolom:has(#status:empty) { display: none; }

  /* waar ze nu mee bezig is */
  #werk { font-size: 15.5px; line-height: 1.65; }
  #opgave { color: var(--muted); white-space: pre-wrap; font-family: var(--mono); font-size: 14px; }
  #antwoord { color: var(--ink); white-space: pre-wrap; min-height: 1.5em; font-family: var(--mono); font-size: 15px; margin-top: 6px; }
  #antwoord.goed { color: var(--mint); }
  #antwoord.fout { color: var(--coral); }
  #uitleg { font-size: 12.5px; color: var(--dim); margin-top: 8px; }
  #herinnert { margin-top: 12px; font-size: 13.5px; line-height: 1.7; color: var(--dim); }
  #herinnert .kopje { margin-bottom: 4px; }
  #herinnert .h { opacity: .8; font-family: var(--mono); font-size: 12.5px; }

  /* proefwerken als chips per blad: kleur naar score */
  #proefwerken .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 0 12px; }
  #proefwerken .chip { display: inline-flex; gap: 7px; align-items: baseline; padding: 4px 11px;
                       border-radius: 100px; border: 1px solid var(--line); background: var(--surface-2);
                       line-height: 1.6; white-space: nowrap; font-size: 13.5px; }
  #proefwerken .chip b { font-family: var(--mono); font-weight: 700; color: var(--ink); }
  #proefwerken .chip.hoog b { color: var(--mint); }
  #proefwerken .chip.midden b { color: var(--sky); }
  #proefwerken .chip.laag b { color: var(--coral); }
  #proefwerken .chip.dim { opacity: .5; }

  /* het zelfrapport en het gesprek */
  #zelfrapport .stem { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--dim);
                       text-transform: uppercase; margin-top: 12px; }
  #zelfrapport .amber { color: var(--lilac); font-size: 16px; line-height: 1.55; }
  #zelfrapport .regel { color: var(--dim); font-size: 12.5px; margin-top: 10px; }
  #zelfrapport ul { margin: 4px 0 0 1.2em; font-size: 14px; }
  .gesprek-knoppen { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
  .gesprek-knoppen button { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
                            border-radius: 100px; padding: 7px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
  .gesprek-knoppen button:hover { border-color: var(--sky); }
  .gesprek-knoppen button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .gesprek-knoppen button:disabled { opacity: .45; cursor: default; }
  .gesprek-knoppen input { background: var(--bg); color: var(--ink); border: 1px solid var(--line);
                           border-radius: 100px; padding: 7px 14px; min-width: 160px; flex: 1; }
  .gesprek-knoppen input:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .gesprek-log { max-height: 220px; overflow-y: auto; font-size: 13.5px; border-top: 1px solid var(--line);
                 padding-top: 8px; scrollbar-width: thin; }
  .gesprek-log .beurt { margin: 4px 0; }
  .gesprek-log .wanneer { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .gesprek-log .zij { color: var(--lilac); }
  .gesprek-log .cley { color: var(--sky); }

  /* haar wereld, keuzes, geheugen */
  #wereld .rij, #geheugen .rij, #keuzes .rij { display: flex; gap: 12px; align-items: center; min-height: 28px; }
  #wereld .rij > span:first-child, #geheugen .rij > span:first-child, #keuzes .rij > span:first-child {
    min-width: 9ch; white-space: nowrap; color: var(--ink); font-size: 14px; }
  #wereld .balk { display: flex; gap: 1.5px; flex: 1 1 0; min-width: 0; overflow: hidden; }
  #wereld .rij > span:last-child { flex: none; min-width: 6ch; margin-left: 4px; text-align: right; font-family: var(--mono); font-size: 13px; }
  #wereld .blokje { flex: 1 1 7px; max-width: 7px; min-width: 1px; height: 11px; border-radius: 2px; background: var(--surface-2); }
  #wereld .blokje.aan { background: var(--sky); }
  #wereld .nieuw { color: var(--mint); animation: fonkel 1.2s ease-in-out infinite; }
  #wereld .doorbraak, #keuzes .doorbraak { font-size: 12.5px; color: var(--dim); }
  @keyframes fonkel { 50% { opacity: .35; } }
  #keuzes .rij { flex-wrap: wrap; }
  #keuzes .balk { display: inline-block; width: 110px; height: 8px; background: var(--surface-2);
                  border-radius: 4px; overflow: hidden; }
  #keuzes .vul { display: block; height: 8px; border-radius: 4px; }
  #geheugen .rij { align-items: flex-end; }
  #geheugen .staven { display: flex; gap: 2px; align-items: flex-end; height: 22px; flex: 1 1 0; min-width: 0; }
  #geheugen .staaf { flex: 1 1 8px; max-width: 8px; min-width: 2px; border-radius: 2px 2px 0 0;
                     background: var(--lilac); opacity: .85; min-height: 2px; }
  #geheugen .fles { font-size: 12.5px; color: var(--dim); margin-top: 6px; }

  /* de levenslijn */
  #lijnvak #lijnwaarde { font-family: var(--mono); font-size: 13px; color: var(--mint); margin-top: 4px; }
  #lijn { display: block; margin-top: 6px; width: 100%; max-width: 420px; height: 64px; }

  #spreek { cursor: pointer; color: var(--sky); }
  #spreek:hover { text-decoration: underline; }

  /* toast: één rustige melding onderin */
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0;
           background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); padding: 10px 18px;
           border-radius: 100px; font-size: 14px; z-index: 9; pointer-events: none;
           transition: opacity .25s, transform .25s; max-width: min(92vw, 560px); text-align: center; }
  #toast.zien { opacity: 1; transform: translate(-50%, 0); }
  #toast.goed { border-color: rgba(127,224,195,.5); }
  #toast.mis { border-color: rgba(255,154,122,.5); }

  @media (prefers-reduced-motion: reduce) {
    .tegel .balk i, #toast, #titel .pijl { transition: none; }
    #wereld .nieuw { animation: none; }
  }
  @media (max-width: 760px) {
    body { -webkit-text-size-adjust: 100%; font-size: 14.5px; }
    #bovenbalk { gap: 12px; flex-wrap: wrap; }
    #uren { order: 3; width: 100%; }
    #stappen { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tegel.tegel-stap { grid-column: 1 / -1; }
    #onder { gap: 10px; }
    .kaart { padding: 13px 14px 15px; }
    #opgave { word-break: break-word; }
  }
</style>
</head>
<body>
<header id="bovenbalk">
  <div id="titel">Amber <span class="pijl">▾</span></div>
  <div id="menu"></div>
  <div id="uren"></div>
  <div id="pil" class="pil">…</div>
</header>
<canvas id="doek"></canvas>
<section id="stappen" aria-label="voortgang"></section>
<div id="onder">
  <div class="kaart breed" id="werk">
    <div class="kop">waar ze nu mee bezig is</div>
    <div id="opgave"></div>
    <div id="antwoord"></div>
    <div id="uitleg"></div>
    <div id="herinnert"></div>
  </div>
  <div class="kaart" id="runkolom">
    <div class="kop">de run</div>
    <div id="status">wachten op de kijker&hellip;</div>
  </div>
  <div class="kaart" id="proefwerken" style="display:none"></div>
  <div class="kaart" id="wereld"></div>
  <div class="kaart" id="keuzes"></div>
  <div class="kaart" id="geheugen"></div>
  <div class="kaart" id="zelfrapport" style="display:none"></div>
  <div class="kaart" id="lijnvak" style="display:none">
    <div class="kopje">haar levenslijn — ladder-proefwerk deze run</div>
    <canvas id="lijn" width="420" height="64"></canvas>
    <div id="lijnwaarde"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

let spreekVanaf = 0;
document.addEventListener("click", async (e) => {
  if (e.target.id !== "spreek") return;
  e.target.textContent = "🔊 ze formuleert…";
  spreekVanaf = Date.now() / 1000;
  await fetch("/spreek");
  const wacht = setInterval(async () => {
    try {
      const m = await (await fetch("/rapport/stem-stand.json",
                                   {cache: "no-store"})).json();
      if (m.tijd > spreekVanaf) {
        clearInterval(wacht);
        const a = document.getElementById("stem-audio");
        a.src = "/rapport/stem-stand.wav?" + m.tijd;
        a.play();
        e.target.textContent = "🔊 vertel de stand";
      }
    } catch (err) {}
  }, 2000);
  setTimeout(() => { clearInterval(wacht);
    e.target.textContent = "🔊 vertel de stand"; }, 90000);
});
document.getElementById("titel").addEventListener("click", () => {
  document.getElementById("titel").classList.toggle("open");
  document.getElementById("menu").classList.toggle("open");
});
const doek = document.getElementById("doek");
const ctx = doek.getContext("2d");
let B = 1, H = 1;
let KOL = [32, 32,32,32,32,32,32,32,32, 1];
let NAMEN = [];
let stand = null, wachtrij = [], rijNu = null, rijStart = 0;
let gloed = KOL.map(n => new Array(n).fill(0));
let kolMax = KOL.map(() => 0.0001);
let bedrading = null, bedradingUit = null, weefsel = [];
let vonken = [];
let antwoordDoel = "", antwoordNu = 0, laatstTonen = 0;
const DUUR = 1300;

const stof = Array.from({length: 45}, () => ({
  x: Math.random(), y: Math.random(),
  r: 0.4 + Math.random() * 1.3, s: 0.00002 + Math.random() * 0.00006,
  tw: Math.random() * 6.28 }));

// Het weefsel is sinds 14 aug 2026 een brede, lage band bovenin (Cleys
// aanwijzing): alle tekst staat erónder in plaats van erop. Deze drie
// getallen zijn de hele maatvoering.
const MIDDEN = 0.30, HOOG = 0.42, RANDX = 0.04, BAND = 0.58;
function plaats(kol, i) {
  const bx = B * RANDX, ex = B * (1 - RANDX);
  const x = bx + (ex - bx) * kol / (KOL.length - 1);
  const midden = H * MIDDEN, hoog = H * HOOG;
  const n = KOL[kol];
  const y = n === 1 ? midden : midden - hoog / 2 + hoog * i / (n - 1);
  return [x, y];
}
function kromming(y1, y2) {
  // draden bollen weg van het midden: samen vormen ze de lensvormen
  const midden = H * MIDDEN;
  const m = (y1 + y2) / 2;
  return m + (m - midden) * 0.55 + (y2 - y1) * 0.08;
}

const DPR = Math.min(devicePixelRatio || 1, 1.5);
let achtergrond = null;
function maat() {
  B = doek.width = innerWidth * DPR;
  H = innerHeight * DPR;                       // de maat van de tekening
  doek.height = Math.round(H * BAND);          // getoond: de bovenste band
  achtergrond = document.createElement("canvas");
  achtergrond.width = B; achtergrond.height = H;
  const q = achtergrond.getContext("2d");
  const g = q.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#080b1e"); g.addColorStop(.5, "#0c1230");
  g.addColorStop(1, "#070a1a");
  q.fillStyle = g; q.fillRect(0, 0, B, H);
  gloedSprite = document.createElement("canvas");
  gloedSprite.width = gloedSprite.height = 64;
  const qs = gloedSprite.getContext("2d");
  const rg = qs.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, "rgba(190,215,255,0.9)");
  rg.addColorStop(1, "rgba(190,215,255,0)");
  qs.fillStyle = rg; qs.beginPath(); qs.arc(32, 32, 32, 0, 7); qs.fill();
  bouwWeefsel();
}
let gloedSprite = null;
addEventListener("resize", maat);

function bouwWeefsel() {
  // Het vaste weefsel: per overgang haar sterkste verbindingen, één keer
  // getekend op een eigen laag. Groen = plus, rood = min — echt uit haar
  // gewichten. Per beeld schuift alleen de helderheid, dat houdt het licht.
  weefsel = [];
  if (!bedrading) return;
  for (let k = 0; k < KOL.length - 1; k++) {
    const [x1k] = plaats(k, 0), [x2k] = plaats(k + 1, 0);
    const marge = B * 0.012;
    const links = Math.max(0, x1k - marge);
    const breed = Math.min(B - links, x2k - x1k + 2 * marge);
    const c = document.createElement("canvas");
    c.width = Math.max(2, Math.round(breed)); c.height = H;
    c.dataset.links = links;
    const q = c.getContext("2d");
    q.translate(-links, 0);
    q.globalCompositeOperation = "lighter";
    let paren = [];
    if (k < KOL.length - 2) {
      const M = bedrading[k];            // [doel][bron], genormaliseerd
      for (let b = 0; b < KOL[k]; b++)
        for (let d = 0; d < KOL[k + 1]; d++) {
          const w = M[d] ? (M[d][b] || 0) : 0;
          if (Math.abs(w) > 0.04) paren.push([Math.abs(w), w > 0, b, d]);
        }
      paren.sort((a, z) => z[0] - a[0]);
      paren = paren.slice(0, 240);
    } else {
      for (let b = 0; b < KOL[k]; b++)
        paren.push([(bedradingUit ? bedradingUit[b] : 0.5), true, b, 0]);
    }
    for (const [w, plus, b, d] of paren) {
      const [x1, y1] = plaats(k, b);
      const [x2, y2] = plaats(k + 1, d);
      q.strokeStyle = plus
        ? `rgba(105,225,150,${(0.05 + w * 0.30).toFixed(3)})`
        : `rgba(255,115,85,${(0.05 + w * 0.30).toFixed(3)})`;
      q.lineWidth = Math.max(0.6, Math.min(B, H) * 0.0007);
      q.beginPath();
      q.moveTo(x1, y1);
      q.quadraticCurveTo((x1 + x2) / 2, kromming(y1, y2), x2, y2);
      q.stroke();
    }
    weefsel.push(c);
  }
}

// Laagnamen uit haar meting (16 aug 2026, Cleys keuze): de kijker meet per
// laag welke familie hem naar verhouding het meest laat oplichten en
// schrijft dat in stand.json (laagnamen); hier wordt het de naam onder de
// laag. Zolang de meting er nog niet is staat er wat er stond.
let laagnamen = {};
function bouwNamen() {
  NAMEN = [["invoer", "inbedding"]];
  for (let i = 1; i < KOL.length - 1; i++)
    NAMEN.push(["laag " + i, laagnamen[i] || "GELU"]);
  NAMEN.push(["uitvoer", "zekerheid"]);
}
bouwNamen();


// Haar eigen keuzes (F, 17 aug 2026): waar de nieuwsgierigheid heen gaat —
// per familie het aandeel van de jongste ~500 keuzes, de dieptes waar dat
// zat, en een klein verloop per blok van 500 stappen. Bron: server.py telt
// de stap-regels van het logboek (keuzes in stand.json).
function keuzesHtml(k, kop) {
  if (!k || !k.laatste || !k.laatste_n) return "";
  const kleur = {rekenen: "#5ca8ff", puzzel: "#b78ae0", code: "#7fe0c3",
                 geheugen: "#ffb86b", logica: "#ff8fa3", volgorde: "#8fd3ff", tekst: "#e6d37a", zeggen: "#f5a3ff", taal: "#a3ffd6", machine: "#ffd28f", tellen: "#8fffb0", antwoord: "#c8b4ff"};
  const fams = Object.keys(k.laatste).sort((a, b) => k.laatste[b] - k.laatste[a]);
  let h = `<div class="kop">${kop} · laatste ${k.laatste_n} keuzes</div>`;
  for (const f of fams) {
    const pct = Math.round(100 * k.laatste[f] / k.laatste_n);
    const pd = (k.per_diepte && k.per_diepte[f]) || {};
    const ds = Object.keys(pd).map(Number).sort((a, b) => a - b);
    let top = null, topN = -1;
    for (const d of ds) if (pd[d] > topN) { topN = pd[d]; top = d; }
    const bereik = ds.length ? (ds.length === 1 ? `diepte ${ds[0]}`
      : `diepte ${ds[0]}–${ds[ds.length - 1]}, meest ${top}`) : "";
    h += `<div class="rij"><span style="color:${kleur[f] || "#8ea0c0"}">${f}</span>`
      + `<span class="balk">`
      + `<span class="vul" style="width:${pct}%;background:${kleur[f] || "#5ca8ff"}"></span></span>`
      + `<span>${pct}%</span><span class="doorbraak">${bereik}</span></div>`;
  }
  // het verloop: gestapelde aandelen per blok, klein en stil
  const reeks = k.reeks || [];
  if (reeks.length >= 2) {
    const W = 220, H = 26, n = reeks.length;
    let svg = `<svg width="${W}" height="${H}" style="display:block;margin-top:4px">`;
    reeks.forEach((b, i) => {
      let y = 0;
      const x = Math.round(i * W / n), w = Math.max(1, Math.round(W / n) - 1);
      for (const f of Object.keys(b.aandeel).sort()) {
        const hh = b.aandeel[f] * H;
        svg += `<rect x="${x}" y="${(y).toFixed(1)}" width="${w}" height="${hh.toFixed(1)}" fill="${kleur[f] || "#8ea0c0"}" opacity=".85"><title>stap ${b.stap.toLocaleString("nl")}: ${f} ${Math.round(b.aandeel[f] * 100)}%</title></rect>`;
        y += hh;
      }
    });
    svg += "</svg>";
    h += `<div class="doorbraak">verloop per 500 stappen (${reeks[0].stap.toLocaleString("nl")} → ${reeks[n - 1].stap.toLocaleString("nl")})</div>` + svg;
  }
  return h;
}

    if (z.amber_vraagt) {
      h += `<div class="stem">amber vraagt</div><div class="amber">"${z.amber_vraagt}"</div>`;
    }
    h += `<div class="stem">jouw antwoord</div><div class="gesprek-knoppen">`
       + ["ja", "nee", "later"].map(a => `<button onclick="antwoordCley('${a}')">${a}</button>`).join("")
       + `<input id="antwoord-vrij" placeholder="eerst rekenen …" maxlength="60"><button onclick="antwoordCley(document.getElementById('antwoord-vrij').value)">stuur</button></div>`;
    try {
      const log = await (await fetch("/amber-zegt.json", {cache: "no-store"})).json();
      if (log.length) {
        h += `<div class="stem">het gesprek</div><div class="gesprek-log">`;
        for (const r of log.slice().reverse()) {
          h += `<div class="beurt"><span class="wanneer">${r.wanneer} · ${(+r.stap).toLocaleString("nl")}</span> `
             + `<span class="zij">amber: ${r.vraagt || r.zegt || "—"}</span>`
             + (r.antwoord_cley ? ` <span class="cley">cley: ${r.antwoord_cley}</span>` : ``) + `</div>`;
        }
        h += `</div>`;
      }
    } catch (e) {}
    h += `<div class="stem">het systeem</div><ul>` + (z.voorstellen || []).map(v => `<li>${v}</li>`).join("") + `</ul>`;
    if ((z.waarnemingen || []).length) h += `<div class="stem">waarnemingen</div><ul>` + z.waarnemingen.map(v => `<li>${v}</li>`).join("") + `</ul>`;
    h += `<div class="regel">${z.regel}</div>`;
    k.innerHTML = h; k.style.display = "block";
  } catch (e) {}
}
haalZelfrapport(); setInterval(haalZelfrapport, 300000);
let antwoordSlot = 0;
function toast(tekst, soort) {
  const t = document.getElementById("toast");
  t.textContent = tekst; t.className = "zien " + (soort || "");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => { t.className = ""; }, 4000);
}
async function antwoordCley(a) {
  a = (a || "").trim(); if (!a) return;
  // Eén antwoord per vier seconden (24 aug 2026): een dubbele klik op
  // "later" bezorgde die avond twee keer dezelfde les in haar bus.
  if (Date.now() < antwoordSlot) { toast("even wachten — je antwoord is net verstuurd"); return; }
  antwoordSlot = Date.now() + 4000;
  document.querySelectorAll(".gesprek-knoppen button").forEach(b => b.disabled = true);
  setTimeout(() => document.querySelectorAll(".gesprek-knoppen button").forEach(b => b.disabled = false), 4000);
  try {
    const r = await (await fetch("/antwoord-cley?antwoord=" + encodeURIComponent(a), {cache: "no-store"})).json();
    if (r.geantwoord) {
      const v = document.getElementById("antwoord-vrij"); if (v) v.value = "";
      toast(`bezorgd: "${a}" — zij leert het op de volgende rungrens`, "goed");
      haalZelfrapport();
    } else toast("er staat geen vraag van haar open om te beantwoorden", "mis");
  } catch (e) { toast("het venster kon het antwoord niet kwijt — probeer nog eens", "mis"); }
}

maat();

function teken(t) {
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.drawImage(achtergrond, 0, 0);

  const mn = Math.min(B, H);
  for (const p of stof) {
    p.y -= p.s; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
    const tw = 0.3 + 0.3 * Math.sin(t / 900 + p.tw);
    ctx.fillStyle = `rgba(190,210,255,${tw.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(p.x * B, p.y * H, p.r * devicePixelRatio, 0, 7); ctx.fill();
  }

  if (!rijNu && wachtrij.length) { rijNu = wachtrij.shift(); rijStart = t; }
  let front = -1;
  if (rijNu) {
    front = (t - rijStart) / DUUR * KOL.length;
    if (front >= KOL.length + 1.5) {
      if (!wachtrij.length) wachtrij.push(rijNu);
      rijNu = wachtrij.shift(); rijStart = t; front = 0;
    }
  }
  for (let k = 0; k < KOL.length; k++) {
    for (let i = 0; i < KOL[k]; i++) {
      // Geen golf die hele kolommen tegelijk aanzet (Cleys aanwijzing,
      // 11 aug 2026): een bolletje gloeit alléén als er werkelijk een
      // vonkje bij hem aankomt — de aankomstbult verderop — en dooft
      // daarna vanzelf uit. Net als de draadjes.
      gloed[k][i] = gloed[k][i] * 0.97;
    }
  }

  // het weefsel: altijd zichtbaar, en de overgang waar de golf zit gloeit op
  ctx.globalCompositeOperation = "lighter";
  const adem = 0.5 + 0.5 * Math.sin(t / 4000 * 2 * Math.PI);
  for (let k = 0; k < weefsel.length; k++) {
    let a = 0.34 + 0.10 * adem;
    if (rijNu && front >= k - 0.2 && front < k + 2.0) a = Math.min(1, a + 0.55);
    ctx.globalAlpha = a;
    ctx.drawImage(weefsel[k], +weefsel[k].dataset.links, 0);
  }
  ctx.globalAlpha = 1;

  // vonkjes langs de draden waar de golf loopt
  if (rijNu && vonken.length < 90 && Math.random() < 0.7) {
    const k = Math.max(0, Math.min(KOL.length - 2, Math.floor(front)));
    const sterk = rijNu[k].map((v, i) => [v / kolMax[k], i])
      .sort((x, y) => y[0] - x[0]).slice(0, 10);
    const doelK = rijNu[k + 1].map((v, i) => [v / kolMax[k + 1], i])
      .sort((x, y) => y[0] - x[0]).slice(0, 10);
    const [, b] = sterk[Math.floor(Math.random() * sterk.length)] || [0, 0];
    const [, d] = doelK[Math.floor(Math.random() * doelK.length)] || [0, 0];
    vonken.push({k, b, d, u: 0, sn: 0.014 + Math.random() * 0.02});
  }
  for (const v of vonken) {
    v.u += v.sn;
    const u = Math.min(1, v.u);
    const [x1, y1] = plaats(v.k, v.b);
    const [x2, y2] = plaats(v.k + 1, v.d);
    const cy = kromming(y1, y2), cx = (x1 + x2) / 2;
    const w = 1 - u;
    const x = w * w * x1 + 2 * w * u * cx + u * u * x2;
    const y = w * w * y1 + 2 * w * u * cy + u * u * y2;
    // het draadje waarover hij reist licht zacht mee: aanzwellen naar
    // het midden van de reis, uitdoven naar het eind — nooit een flits
    const zwel = Math.sin(Math.PI * u);
    ctx.strokeStyle = `rgba(215,232,255,${(0.18 * zwel).toFixed(3)})`;
    ctx.lineWidth = mn * 0.0011;
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
    ctx.fillStyle = `rgba(235,244,255,${(0.85 * (1 - u * 0.4)).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(x, y, mn * 0.0016, 0, 7); ctx.fill();
    // aankomst: het bolletje gloeit zacht mee en dooft vanzelf (x0,97
    // per beeldje); de uitvoerbol ademt en doet hier niet aan mee
    if (v.u >= 1 && gloed[v.k + 1])
      gloed[v.k + 1][v.d] = Math.min(1, (gloed[v.k + 1][v.d] || 0) + 0.45);
  }
  vonken = vonken.filter(v => v.u < 1);

  // de kolommen zelf, met een gloed aan de invoer als de golf daar begint
  for (let k = 0; k < KOL.length; k++)
    for (let i = 0; i < KOL[k]; i++) {
      const [x, y] = plaats(k, i);
      // de bol ademt: een trage, zachte puls van ~5 seconden — bewust
      // zonder flitsen (Cley is gevoelig voor knipperende beelden)
      const gl = KOL[k] === 1
        ? 0.25 + 0.28 * (0.5 + 0.5 * Math.sin(t / 800))
        : gloed[k][i];
      const r = mn * (KOL[k] === 1 ? 0.008 : 0.0021) * (1 + 1.7 * gl);
      ctx.fillStyle = `rgba(${205 + 50 * gl | 0},${220 + 35 * gl | 0},255,${(0.5 + 0.5 * gl).toFixed(2)})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      if (gl > 0.4) {
        ctx.globalAlpha = 0.4 * gl;
        const d = r * 10;
        ctx.drawImage(gloedSprite, x - d / 2, y - d / 2, d, d);
        ctx.globalAlpha = 1;
      }
    }
  if (rijNu && front < 1.6) {
    const [x0] = plaats(0, 0);
    ctx.globalAlpha = 0.3 * (1.6 - front) / 1.6;
    const d = mn * 0.6;
    ctx.drawImage(gloedSprite, x0 - d / 2, H * 0.465 - d / 2, d, d);
    ctx.globalAlpha = 1;
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.textAlign = "left";
  // de letters passen tussen twee kolommen (18 aug 2026): op een smal
  // scherm met veel lagen liepen de laagnamen over elkaar
  const kolAfstand = B * (1 - 2 * RANDX) / Math.max(1, KOL.length - 1);
  const fs = Math.max(7, Math.min(mn * 0.0102, kolAfstand / 6.2));
  ctx.font = `${fs}px ui-monospace, Consolas, monospace`;
  for (let k = 0; k < KOL.length; k++) {
    const [x] = plaats(k, 0);
    const [, yb] = plaats(k, KOL[k] - 1);
    const y = (KOL[k] === 1 ? H * MIDDEN : yb) + fs * 2.2;
    ctx.textAlign = k === KOL.length - 1 ? "right" : "left";
    const lx = k === KOL.length - 1 ? x + fs : x - fs;
    ctx.fillStyle = "rgba(225,235,255,0.85)";
    ctx.fillText(NAMEN[k][0], lx, y);
    ctx.fillStyle = "rgba(255,140,90,0.8)";
    ctx.fillText(NAMEN[k][1], lx, y + fs * 1.35);
  }
  ctx.textAlign = "left";

  if (antwoordNu < antwoordDoel.length && t - laatstTonen > DUUR / 4) {
    antwoordNu += 1; laatstTonen = t;
    document.getElementById("antwoord").textContent =
      antwoordDoel.slice(0, antwoordNu);
  }
  requestAnimationFrame(teken);
}
requestAnimationFrame(teken);

</script>
