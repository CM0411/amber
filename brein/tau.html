<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Amber · Sterrenwacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap">
<style>
  /* 27 aug 21:58, Cley: alles wat blauw was is rood */
  /* Cleys schets op papier, 27 aug 2026. Live sinds 18:37.
     Ronde 2 (18:50): Amber en wereld hoger · lagen groter, alleen de draden waar iets gebeurt gaan aan,
     groen = plus, rood = min · het balletje gaat dóór de draad en splitst bij antwoord · tekst krimpt mee ·
     achtergrond zwart · Amber rood zoals Tau · bolletjes door de draden naar de vakken.
     Ronde 3 (19:05): onthouden tikt live mee · vraag/antwoord/geheugen rood · sneller (canvas, geen glasfilters).
     Ronde 4 (19:20): het brein precies zoals de Sterrenwacht van 25 aug (32 groepen per laag, de 10 sterkste
     gewichten per groep, licht = boven haar gewone niveau, vonkjes, live per teken) — en de bolletjes rood.
     Bronnen: /stand.json (elke 5 s) en /rapport/live.json (elke 2 s). */
  :root {
    --bg: #000000; --bg-2: #07070C; --glas: rgba(8,8,14,.86);
    --rand: rgba(255,90,100,.20); --rand-2: rgba(120,160,255,.32);
    --ink: #FFE9E5; --muted: #D9B3B5; --dim: #9A6F74;
    --mint: #FF2E3A; --coral: #FF3FA0; --sky: #FF7A66; --lilac: #FF2E3A; --amber: #FFD23F;
    --rood: #FF2E3A; --rood-2: #FF7A66; --rood-3: #FFB3A0; --groen: #7FE0C3; --min: #FF9A7A;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    --tekst: "Atkinson Hyperlegible", system-ui, sans-serif;
    --merk: "Syne", "Atkinson Hyperlegible", sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--tekst); line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden;
         display: grid; place-items: center; }
  b { color: var(--ink); }
  #toneel { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 30%, #0B0B14 0%, #040407 55%, #000 100%); }

  #doek { position: relative; z-index: 1; width: min(100vw, 160vh); aspect-ratio: 16 / 10; container-type: inline-size; }
  #doek > svg, #doek > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Wereld: klik → verslag van alle runs (Cley, 27 aug 22:30) */
  #doek > #wereld { cursor: pointer; }
  #verslag { position: absolute; left: 1.5%; top: 4%; width: 75%; height: 92%; z-index: 7; background: #0A0A10; border: 1px solid var(--rand); border-radius: .4cqi; padding: .9cqi 1.1cqi; display: none; overflow: auto; font-family: var(--mono); color: var(--ink); box-sizing: border-box; }
  #verslag.open { display: block; }
  #verslag .kop { font-size: .62cqi; letter-spacing: .18em; text-transform: uppercase; color: var(--rood); display: flex; justify-content: space-between; cursor: pointer; }
  #verslag .kop small { color: var(--dim); text-transform: none; letter-spacing: .08em; }
  #verslag .kolommen { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.6cqi; margin-top: .4cqi; }
  #verslag h4 { font-size: .6cqi; letter-spacing: .16em; text-transform: uppercase; color: var(--rood); margin: .9cqi 0 .3cqi; font-weight: 600; }
  #verslag table { width: 100%; border-collapse: collapse; font-size: .64cqi; }
  #verslag td, #verslag th { text-align: left; padding: .1cqi .3cqi; border-bottom: 1px solid var(--rand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 12cqi; }
  #verslag th { color: var(--dim); font-weight: 500; }
  #verslag td.n, #verslag th.n { text-align: right; font-variant-numeric: tabular-nums; }
  #verslag tr.nu td { color: var(--rood); }
  #verslag .plus { color: var(--groen); } #verslag .min { color: var(--min); }
  #verslag .balkje { display: inline-block; height: .32cqi; background: var(--rood); vertical-align: middle; border-radius: 1px; margin-right: .3cqi; }
  #verslag svg { width: 100%; height: auto; display: block; }
  #verslag .geb { font-size: .62cqi; line-height: 1.5; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #verslag .geb b { color: var(--ink); font-weight: 600; } #verslag .geb i { color: var(--dim); font-style: normal; }
  #doek > #stilDoek, #doek > #lagenDoek { z-index: 1; inset: auto; left: 49.375%; top: 14%; width: 50.625%; height: 68%; }   /* alleen het breinvak (790,140)-(1600,820): kleine doeken, anders trekt Safari's GPU-proces het niet (27 aug) */ #doek > #s { z-index: 2; } #doek > #oogBuiten { z-index: 3; pointer-events: none; inset: auto; left: 34.375%; top: 6.8%; width: 11.25%; height: 18%; }   /* het oog: 7 ringlagen, elk met eigen draai (Cley, 27 aug 21:45) */
  #doek > #tauDoek { z-index: 3; pointer-events: none; inset: auto; left: 26.875%; top: 0; width: 26.25%; height: 38%; }   /* alleen Amber's vak (430,0)-(850,380): een klein doek, anders trekt Safari het niet (27 aug) */

  .vak { position: absolute; z-index: 4; background: var(--glas); border: 1px solid var(--rand); border-radius: .4cqi;
         padding: .6cqi .75cqi; display: flex; flex-direction: column; gap: .36cqi; overflow: hidden; }
  .vak .kop { font-family: var(--mono); font-size: .62cqi; letter-spacing: .18em; text-transform: uppercase; color: var(--mint); display: flex; justify-content: space-between; gap: .5cqi; }
  .vak .kop small { color: var(--dim); letter-spacing: .08em; text-transform: none; font-size: .58cqi; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vak .r { display: flex; justify-content: space-between; gap: .6cqi; font-family: var(--mono); font-size: .75cqi; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .vak .r b { font-weight: 700; }
  .vak .balk { height: .19cqi; border-radius: .1cqi; background: rgba(140,170,220,.15); overflow: hidden; flex: none; }
  .vak .balk i { display: block; height: 100%; background: var(--mint); transition: width .6s; }
  .vak .balk.warm i { background: var(--amber); }
  .vak .balk.vol i { background: var(--lilac); }
  .stip-aan::before, .stip-uit::before, .stip-warm::before { content: ""; display: inline-block; width: .44cqi; height: .44cqi; border-radius: 50%; margin-right: .5cqi; }
  .stip-aan::before { background: var(--mint); box-shadow: 0 0 .5cqi var(--mint); }
  .stip-warm::before { background: var(--amber); box-shadow: 0 0 .5cqi var(--amber); }
  .stip-uit::before { background: var(--dim); }

  #wereld   { left: 1.5%;  top: 4%;    width: 26.5%; height: 54%; }   /* raster: linkerkolom 1,5–28 %, rijen 4–58 / 60–77 / 79–96 (Cley, 27 aug 22:15) */
  #wereld .lijst { display: flex; flex-direction: column; gap: .3cqi; overflow: hidden; }
  #runstat  { left: 1.5%;  top: 60%;   width: 12.75%; height: 17%; }
  #gpustat  { left: 15.25%; top: 60%;  width: 12.75%; height: 17%; }
  #machines { left: 1.5%;  top: 79%;   width: 26.5%; height: 17%; transition: top .25s, height .25s; }
  #machines.open { top: 60%; height: 36%; z-index: 6; background: #0A0A10; }   /* klik op een machine: alle details (Cley, 27 aug 22:00) */
  #machines .r.m { cursor: pointer; }
  #machines .r.m:hover span { color: var(--rood); }
  #m-detail .kop { margin-top: .5cqi; }
  #m-detail .rijen { display: grid; grid-template-columns: 1fr 1.15fr; column-gap: 1.4cqi; row-gap: .12cqi; align-items: start; }
  #m-detail .r { font-size: .68cqi; white-space: normal; align-items: baseline; }
  #m-detail .r b { text-align: right; }
  #echt     { left: 79%;   top: 79%;   width: 17%;   height: 17%; }
  #gedachten{ left: 31%;   top: 79%;   width: 18%;   height: 17%; }   /* haar gedachten, recht onder haar punt (Cley, 27 aug 21:15) */
  .gedachte { font-family: var(--mono); font-size: .72cqi; line-height: 1.3; color: var(--dim); }
  .gedachte.nu { font-size: .8cqi; color: var(--ink); }
  .knoppen { display: flex; gap: .4cqi; margin-top: .3cqi; }
  .knoppen button { font-family: var(--mono); font-size: .62cqi; letter-spacing: .12em; text-transform: uppercase; background: transparent; color: var(--ink); border: 1px solid var(--rand); border-radius: .3cqi; padding: .18cqi .6cqi; cursor: pointer; }
  .knoppen button:hover { border-color: var(--rood); color: var(--rood); }
  .knoppen button:disabled { opacity: .4; cursor: default; }
  #ged-vrij { font-family: var(--mono); font-size: .75cqi; background: transparent; color: var(--ink); border: 0; border-bottom: 1px solid var(--rand); outline: none; padding: .25cqi 0; width: 100%; margin-top: .3cqi; }
  #ged-vrij::placeholder { color: var(--dim); }
  #ged-voet { font-family: var(--mono); font-size: .62cqi; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ged-vrij:focus { border-bottom-color: var(--rood); }
  #echt .kop { color: var(--rood); }
  #echt .w { font-family: var(--mono); font-size: .8cqi; font-weight: 500; color: var(--ink); line-height: 1.35; white-space: pre-wrap; overflow: hidden; transition: color .3s; }
  #echt .w.goed { color: var(--groen); }
  #echt .w.fout { color: var(--min); }
  #echt .oordeel { font-family: var(--mono); font-size: .62cqi; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-top: auto; }
  #echt .oordeel.goed { color: var(--groen); } #echt .oordeel.fout { color: var(--min); }

  .naam { font-family: var(--mono); font-size: 12px; fill: var(--muted); text-anchor: middle; letter-spacing: .12em; text-transform: uppercase; }
  .naam.klein { font-size: 9.5px; letter-spacing: .08em; text-transform: none; fill: var(--dim); }
  .naam.rood { fill: var(--rood-3); }
  .draad { fill: none; stroke: var(--sky); stroke-opacity: .28; stroke-width: 1.6; stroke-linecap: round; transition: stroke-opacity .3s, stroke .3s, stroke-width .3s; }
  .draad.aan { stroke: var(--mint); stroke-opacity: 1; stroke-width: 2.6; }
  .draad.zacht { stroke: var(--rood); stroke-opacity: .38; stroke-dasharray: 3 6; }
  .draad.rood { stroke: var(--rood); stroke-opacity: .35; }
  .draad.rood.aan { stroke: var(--rood-3); stroke-opacity: 1; }
  .bol { fill: #0C0305; stroke: var(--rood); stroke-width: 2.2; transition: stroke .3s, fill .3s; }
  .bol.aan { stroke: #FFE9E5; fill: #2A0A0E; }
  .schijn { fill: var(--rood); opacity: .12; transition: opacity .3s; } .schijn.aan { opacity: .4; }
  .kern { fill: var(--rood); transition: fill .3s; } .kern.aan { fill: #FFE9E5; }
  .opgave { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); text-anchor: middle; }
  .opgave.k { fill: var(--dim); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; }
  .loper { fill: #fff; } .loper.gloed { fill: var(--mint); opacity: .35; }
  .loper.klein { fill: var(--rood); }
  @keyframes draai { to { transform: rotate(360deg) } }
  .boogje { animation: draai 10s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .boogje { animation: none } }
  #status { position: fixed; right: 10px; bottom: 6px; z-index: 5; font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: .1em; }
</style></head><body>
<div id="toneel"></div>
<div id="doek">
  <canvas id="stilDoek"></canvas>
  <canvas id="lagenDoek"></canvas>
  <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" id="s"></svg>
  <canvas id="tauDoek"></canvas>
  <canvas id="oogBuiten"></canvas>

  <div class="vak" id="wereld">
    <div class="kop"><span>Wereld</span><small id="wereld-sub">dag —</small></div>
    <div class="lijst" id="wereld-lijst"></div>
    <div class="r" style="margin-top:auto"><span>tijd</span><b id="klok">—</b></div>
  </div>

  <div class="vak" id="runstat">
    <div class="kop"><span>Run status</span></div>
    <div class="r"><span>run</span><b id="run-naam">—</b></div>
    <div class="r"><span>stap</span><b id="run-stap">—</b></div>
    <div class="r"><span>doel</span><b id="run-doel">—</b></div>
    <div class="balk"><i id="run-balk" style="width:0%"></i></div>
    <div class="r"><span>nog</span><b id="run-nog">—</b></div>
  </div>

  <div class="vak" id="gpustat">
    <div class="kop"><span>GPU status</span><small>3070 Ti</small></div>
    <div class="r"><span>vermogen</span><b id="gpu-watt">—</b></div><div class="balk"><i id="gpu-watt-balk" style="width:0%"></i></div>
    <div class="r"><span>geheugen</span><b id="gpu-vram">—</b></div><div class="balk"><i id="gpu-vram-balk" style="width:0%"></i></div>
    <div class="r"><span>warmte</span><b id="gpu-temp">—</b></div><div class="balk warm"><i id="gpu-temp-balk" style="width:0%"></i></div>
    <div class="r"><span>cpu</span><b id="cpu-temp">—</b></div>
  </div>

  <div class="vak" id="machines">
    <div class="kop"><span>Machines</span></div>
    <div class="r m"><span id="m-z490" class="stip-uit">Z490</span><b id="m-z490-w">—</b></div>
    <div class="r m"><span id="m-mac" class="stip-aan">MacBook · kijkt mee</span><b id="m-mac-w">nu</b></div>
    <div class="r m"><span id="m-dl" class="stip-uit">DL380</span><b id="m-dl-w">—</b></div>
    <div id="m-detail"></div>
  </div>

  <div class="vak" id="echt">
    <div class="kop"><span>Antwoord</span><small id="echt-fam"></small></div>
    <div class="w" id="echtw">—</div>
    <div class="oordeel" id="echt-oordeel"></div>
  </div>
  <div id="verslag"></div>
  <div class="vak" id="gedachten">
    <div class="kop"><span>Gedachten</span><small id="ged-sub"></small></div>
    <div class="lijst" id="ged-lijst"></div>
    <div class="knoppen" id="ged-knoppen"><button data-a="ja">ja</button><button data-a="nee">nee</button><button data-a="later">later</button></div>
    <input id="ged-vrij" type="text" placeholder="of typ je antwoord en druk op Enter" autocomplete="off">
    <div class="oordeel" id="ged-voet">—</div>
  </div>
</div>
<div id="status">—</div>

<script>
(() => {
  const NS='http://www.w3.org/2000/svg', svg=document.getElementById('s'), $=id=>document.getElementById(id);
  const el=(t,a,txt,parent)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; (parent||svg).appendChild(e); return e };
  const GROEN='127,224,195', ROODMIN='255,154,122', SKY='111,168,255', MINT='41,211,255';   // groen is plus, rood is min (25 aug)
  const RD='#FF2E3A', RD2='#FF7A66', RD3='#FFB3A0', WIT='#FFE9E5';
  const bewegen=!matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- plekken, in doekmaten (1600 × 1000) ----
  const C     = {x:640, y:175}, PUNT={x:640, y:335};   // Amber links van het midden: het brein heeft breedte nodig (19:20)
  const VRAAG = {x:865,y:95};
  // het brein: precies het blok uit de Sterrenwacht (25 aug): IN + 20 lagen + UITVOER, links naar rechts, 32 groepen per laag
  const REG = {x:830, y:190, w:720, h:565};   // 720: ruimte rechts voor de bocht naar ANTWOORD (27 aug 20:55)
  const LTOP = {x:REG.x+REG.w*0.055, y:REG.y+REG.h/2}, LBOT = {x:REG.x+REG.w*0.945, y:REG.y+REG.h/2};   // het punt (links) en de uitvoer (rechts)
  const LMID = REG.x+REG.w/2;
  const ANTW  = {x:1170,y:815};
  const ECHT  = {x:1264,y:875};
  const GEH   = {x:1050,y:885};

  const lijn=(a,b)=>`M${a.x},${a.y} L${b.x},${b.y}`;
  const boog=(a,b,k)=>{ const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1; return `M${a.x},${a.y} Q${mx-dy/L*k},${my+dx/L*k} ${b.x},${b.y}` };

  // ---- draden van Amber naar de vakken, met bolletjes erdoorheen ----
  const naarVak=/* vakken links (Cley, 27 aug 20:20); recht omlaag = haar gedachten (21:15) */[ {x:448,y:330}, {x:126,y:600}, {x:346,y:600}, {x:236,y:790}, {x:640,y:790} ].map(p=>el('path',{class:'draad zacht',d:lijn(PUNT,p)}));
  const vakLopers=[]; naarVak.forEach((p,i)=>{ for(let j=0;j<3;j++) vakLopers.push({p, L:p.getTotalLength(), f:(j/3+i*.13)%1, e:el('circle',{class:'loper klein',r:2.6})}) });

  // ---- de kringloop ----
  const D={};
  D.av = el('path',{class:'draad rood',d:boog(PUNT,VRAAG,-40)});
  D.vl = el('path',{class:'draad rood',d:`M${VRAAG.x},${VRAAG.y} C${VRAAG.x+250},${VRAAG.y+40} ${LTOP.x-150},${LTOP.y-170} ${LTOP.x},${LTOP.y}`});   // omgekeerde S, langs de vraagtekst heen (Cley, 27 aug 20:50)
  D.door = el('path',{class:'draad',d:lijn(LTOP,LBOT),style:'stroke-opacity:0'});
  D.la = el('path',{class:'draad rood',d:`M${LBOT.x},${LBOT.y} C${LBOT.x+65},${LBOT.y} ${LBOT.x+80},${LBOT.y+168} ${LBOT.x+50},${LBOT.y+273} C${LBOT.x+30},${LBOT.y+343} ${ANTW.x+160},${ANTW.y-15} ${ANTW.x},${ANTW.y}`});   // rechts omlaag, onder het brein langs (Cley, 27 aug 20:35)
  D.ae = el('path',{class:'draad rood',d:boog(ANTW,ECHT,-10)});
  D.ag = el('path',{class:'draad rood',d:boog(ANTW,GEH,-30)});
  D.ga = el('path',{class:'draad rood',d:boog(GEH,PUNT,-70)});

  const B={};
  const bol=(p,naam,dx,dy)=>{ const s=el('circle',{class:'schijn',cx:p.x,cy:p.y,r:26}); const o=el('circle',{class:'bol',cx:p.x,cy:p.y,r:15}); const k=el('circle',{class:'kern',cx:p.x,cy:p.y,r:6}); /* kleiner (Cley, 27 aug 21:00) */ el('text',{class:'naam rood',x:p.x+dx,y:p.y+dy},naam); return {s,o,k} };
  B.vraag = bol(VRAAG,'vraag',0,-42);
  B.antw  = bol(ANTW,'antwoord',-72,5);
  B.geh   = bol(GEH,'geheugen',0,52);
  const vraagFam  = el('text',{class:'opgave k',x:VRAAG.x,y:VRAAG.y+50},'');
  const vraagTekst= el('text',{class:'opgave',x:VRAAG.x,y:VRAAG.y+68},'');
  const gehTekst  = el('text',{class:'naam klein',x:GEH.x,y:GEH.y+68},'');

  const kort=(s,n)=>{ s=String(s||'').split('\n')[0].trim(); return s.length>n?s.slice(0,n-1)+'…':s };
  // ---- het brein op een canvas: overgenomen uit de Sterrenwacht (25 aug 2026), in rood ----
  const lc=$('lagenDoek'), lx=lc.getContext('2d'), tc=$('tauDoek'), tx=tc.getContext('2d');
  let schaal=1, dpr=1;
  let KOL=[32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,32,1];
  let bedrading=null, bedradingUit=null, laagnamen={}, standTijd=0, checkpointStap=null;
  let rijen=[], wachtrij=[], kolMax=KOL.map(()=>0.0001), speelStart=0, klaarSinds=0;
  let LIVE=false, herhaal=false, herhaalJ=0, liveTijd=0, liveLaatst=0, liveDoorgang=-1, liveGeschreven=0, liveReeks=[], herhaalI=0, liveBezig=false, liveTekst='';
  const TEKEN_S=0.7, VEEG=0.5, K_PER_GROEP=10, BOCHT=0.3, KS=0.10, KA=0.12, DR=0.5, PLAFOND=16;
  // kleur: rood voor de knopen (Cley, 19:15), groen = plus en rood = min voor de gewichten (25 aug)
  const TINT={draad:"255,120,120", licht:"255,190,180", knoop:"255,90,100", plus:"127,224,195", min:"255,154,122"};
  const tekenKleur=t=>t>0?TINT.plus:t<0?TINT.min:TINT.licht;

  let ikKeek=0; const ikKijk=()=>{ if(document.visibilityState!=='visible'||Date.now()-ikKeek<20000) return; ikKeek=Date.now(); fetch('/ik-kijk',{cache:'no-store'}).catch(()=>{}) };
  ['pointermove','pointerdown','keydown','touchstart','wheel'].forEach(ev=>addEventListener(ev,ikKijk,{passive:true}));
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ ikKeek=0; ikKijk() } });
  let voetTot=0, standNu={}, WERELD_NU=null;   // haar echte wereld uit het logboek (/rapport/wereld.json, dienst amber-machines)
  const wereldNu=(basis)=>{ const w=Object.assign({},basis||{}); const p=WERELD_NU&&WERELD_NU.diepste_per; if(p) for(const k in p) w[k]=Math.max(w[k]||0,p[k]); return w };
  const haal=(pad,fn)=>fetch(pad+'?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(fn).catch(()=>{});
  const stand=()=>haal('/stand.json',zetStand);
  stand(); setInterval(stand,5000);
  // ---- Machines: klik op een machine → alle details (Cley, 27 aug 22:00). Bronnen: /rapport/machines.json (Z490+DL380, dienst amber-machines) en /rapport/mac.json (cron op de MacBook) ----
  const MACH={z490:null,dl380:null,mac:null,tijd:0}; let machOpen=new URLSearchParams(location.search).get('m')||null;
  const haalMach=()=>{ haal('/rapport/wereld.json',d=>{ if(d&&d.diepste_per) WERELD_NU=d }); haal('/rapport/machines.json',d=>{ MACH.z490=d.z490; MACH.dl380=d.dl380; MACH.tijd=d.tijd; tekenMach() }); haal('/rapport/mac.json',d=>{ MACH.mac=d; tekenMach() }) };
  const duur=s=>{ if(s==null) return '—'; s=Math.round(s); const d=Math.floor(s/86400), u=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return d?`${d} d ${u} u`:u?`${u} u ${m} m`:`${m} m` };
  const gb=mb=>mb==null?'—':(mb/1024).toFixed(1).replace('.',',')+' GB';
  const kl=s=>(s==null||s==='')?'—':String(s).replace('.',',');
  const schijf=z=>(z.schijf||[]).length>2?`${z.schijf[1]} van ${z.schijf[0]} (${z.schijf[2]})`:'—';
  const gemeten=t=>{ if(!t) return ''; const oud=Date.now()/1000-t>180; return (oud?'oud · ':'gemeten ')+new Date(t*1000).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) };
  const rij=(k,v)=>`<div class="r"><span>${k}</span><b>${v}</b></div>`;
  const tekenMach=()=>{ const box=$('machines'), det=$('m-detail'); if(!machOpen){ box.classList.remove('open'); det.innerHTML=''; return } box.classList.add('open');
    let kop='', r=[], t=MACH.tijd; const run=standNu.run||{}, w=standNu.wachter||{};
    if(machOpen==='z490'){ const z=MACH.z490, mc=run.machine||{}; kop='Z490 · RTX 3070 Ti';
      if(!z||!z.aan) r.push(rij('status','geen gegevens')); else { r.push(rij('aan sinds',duur(z.uptime_s)), rij('belasting',kl((z.load||[])[0])), rij('cpu',kl(z.cpu_temp)+' °C'), rij('ram',gb(z.ram_gebruikt_mb)+' / '+gb(z.ram_totaal_mb)), rij('schijf',schijf(z)));
        (z.gpu||[]).forEach(g=>{ r.push(rij('gpu',g[1]+' °C · '+Math.round(parseFloat(g[2]))+' W'), rij('vram',kl((parseInt(g[3])/1024).toFixed(1))+' / '+kl((parseInt(g[4])/1024).toFixed(1))+' GB'), rij('gpu bezig',g[5]||'—'), rij('ventilator',(g[6]||'').includes('N/A')?'—':(g[6]||'—'))) });
        r.push(rij('dienst',mc.dienst||w.dienst||'—'), rij('crashes vandaag',w.crashes_vandaag??'—'), rij('spiegel',mc.spiegel||'—')) } }
    else if(machOpen==='dl380'){ const z=MACH.dl380, th=run.thuis||{}; kop='DL380 · 2× Tesla P100';
      if(!z||!z.aan) r.push(rij('status',th.aan?'aan, nog geen meting':'uit')); else { r.push(rij('aan sinds',duur(z.uptime_s)), rij('belasting',kl((z.load||[])[0])), rij('cpu',kl(z.cpu_temp)+' °C'), rij('ram',gb(z.ram_gebruikt_mb)+' / '+gb(z.ram_totaal_mb)), rij('schijf',schijf(z)), rij('array',th.array||'—'));
        (z.gpu||[]).forEach((g,i)=>{ const v=parseInt(g[3])/1024; r.push(rij('kaart '+(i+1),g[1]+' °C · '+Math.round(parseFloat(g[2]))+' W'+(v>=0.1?' · '+kl(v.toFixed(1))+' GB':''))) });
        const ds=th.diensten||{}, aan=Object.keys(ds).filter(k=>ds[k]==='active'), uit=Object.keys(ds).filter(k=>ds[k]!=='active'); r.push(rij('diensten aan',aan.join(', ')||'—')); if(uit.length) r.push(rij('diensten uit',uit.join(', '))) } }
    else { const z=MACH.mac; kop='MacBook · i7'; t=z&&z.tijd;
      if(!z) r.push(rij('status','geen gegevens')); else { r.push(rij('aan sinds',duur(z.uptime_s)), rij('belasting',kl((z.load||[])[0])), rij('cpu bezig',kl(z.cpu_pct)+' %'), rij('ram',gb(z.ram_gebruikt_mb)+' / '+gb(z.ram_totaal_mb)), rij('accu',(z.accu_pct??'—')+' % · '+(z.netstroom?'netstroom':z.accu==='discharging'?'op accu':(z.accu||''))), rij('schijf',schijf(z)), rij('temperatuur','niet zonder beheerrechten')) } }
    det.innerHTML=`<div class="kop"><span>${kop}</span><small>${gemeten(t)}</small></div><div class="rijen">${r.join('')}</div>` };
  [['m-z490','z490'],['m-mac','mac'],['m-dl','dl380']].forEach(([id,naam])=>{ $(id).parentElement.addEventListener('click',()=>{ machOpen=machOpen===naam?null:naam; tekenMach() }) });
  haalMach(); setInterval(haalMach,15000);
  // ---- Wereld: klik → verslag van alle runs (Cley, 27 aug 22:30). Bron: /tijdlijn.json (maak-tijdlijn.py, elk kwartier) + stand.json ----
  let TIJDLIJN=null, tijdlijnTijd=0, verslagOpen=new URLSearchParams(location.search).get('v')==='wereld';
  const nlGetal=n=>(n==null?'—':Math.round(n).toLocaleString('nl-NL'));
  const kortDatum=s=>{ if(!s) return ''; const [j,m,d]=String(s).split('-'); return `${+d} ${['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][+m-1]||''}` };
  const tekenVerslag=()=>{ const v=$('verslag'); if(!verslagOpen){ v.classList.remove('open'); return } v.classList.add('open'); const t=TIJDLIJN;
    if(!t){ v.innerHTML='<div class="kop"><span>Verslag · alle runs</span><small>laden…</small></div>'; return }
    const runs=(t.runs||[]).slice().sort((a,b)=>a.start-b.start), nu=runs[runs.length-1]||{}, vorige=runs.filter(r=>r.eind!=null).sort((a,b)=>a.start-b.start).pop();
    const hek=standNu.wereldrand||{}, wNu=wereldNu((standNu.run||{}).wereld), fams=Object.keys(t.wereld||{});
    const bijStap=(fam,stap)=>{ const w=t.wereld[fam]||{}; let x=null; Object.keys(w).map(Number).sort((a,b)=>a-b).forEach(s=>{ if(s<=stap) x=w[s] }); return x };
    const nuVan=fam=>(typeof wNu[fam]==='number')?wNu[fam]:null;   // net als het vak Wereld: '—' zolang deze run de familie nog niet gemeten heeft
    const famRijen=fams.map(f=>{ const was=vorige?bijStap(f,vorige.eind):null, is=nuVan(f), d=(was!=null&&is!=null)?is-was:null, hk=hek[f], br=(is!=null&&hk)?Math.min(100,is/hk*100):0;
      return `<tr><td>${f}</td><td class="n">${was??'—'}</td><td class="n">${is??'—'}</td><td class="n ${d>0?'plus':d<0?'min':''}">${d==null?'—':(d>0?'+':'')+d}</td><td class="n">${hk?`<span class="balkje" style="width:${(br*0.05).toFixed(1)}cqi"></span>${is??0}/${hk}`:'—'}</td></tr>` }).join('');
    const runRijen=runs.slice().reverse().map(r=>`<tr class="${r.eind==null?'nu':''}" title="${(r.noot||'').replace(/"/g,'&quot;')}"><td>${r.naam}</td><td>${kortDatum(r.datum)}</td><td class="n">${nlGetal(r.start)} → ${r.eind==null?'…':nlGetal(r.eind)}</td><td class="n">${r.venster}</td><td class="n">${r.lagen}</td><td class="n">${(r.families||[]).length}</td><td>${r.hek||''}</td></tr>`).join('');
    const pts=Object.keys(t.punten||{}).map(Number).sort((a,b)=>a-b).map(s=>{ const vs=Object.values(t.punten[s]||{}).filter(x=>typeof x==='number'); return [s, vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null] }).filter(p=>p[1]!=null);
    const maxS=Math.max(pts.length?pts[pts.length-1][0]:1, nu.doel||0, nu.eind||0, 1);
    const X=s=>40+s/maxS*940, Y=x=>200-x/100*180;
    const banden=runs.map((r,i)=>`<rect x="${X(r.start).toFixed(1)}" y="20" width="${Math.max(0,X(r.eind==null?maxS:r.eind)-X(r.start)).toFixed(1)}" height="180" fill="${i%2?'rgba(255,46,58,.07)':'rgba(255,46,58,.02)'}"/><text x="${(X(r.start)+3).toFixed(1)}" y="31" font-size="9" fill="#9A6F74">${r.naam}</text>`).join('');
    const lijn=pts.length?`<polyline fill="none" stroke="#FF2E3A" stroke-width="1.4" points="${pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`:'';
    const assen=[0,25,50,75,100].map(x=>`<line x1="40" x2="980" y1="${Y(x)}" y2="${Y(x)}" stroke="rgba(255,90,100,.15)"/><text x="34" y="${Y(x)+3}" font-size="9" text-anchor="end" fill="#9A6F74">${x}%</text>`).join('');
    const geb=(t.gebeurtenissen||[]).slice(-16).reverse().map(g=>`<div class="geb"><b>${nlGetal(g.stap)}</b> <i>${kortDatum(g.datum)} · ${g.soort||''}</i> ${g.tekst}</div>`).join('');
    v.innerHTML=`<div class="kop"><span>Verslag · alle runs · ${runs.length} runs · ${nu.naam||''} loopt</span><small>tijdlijn ${t.gemaakt||''} · klik hier om te sluiten</small></div>
      <div class="kolommen"><div>
        <h4>Haar wereld · ${vorige?vorige.naam:'vorige run'} → nu</h4>
        <table><tr><th>familie</th><th class="n">${vorige?vorige.naam:'was'}</th><th class="n">nu</th><th class="n">±</th><th class="n">hek</th></tr>${famRijen}</table>
        <h4>Runs</h4>
        <table><tr><th>run</th><th>datum</th><th class="n">stappen</th><th class="n">venster</th><th class="n">lagen</th><th class="n">fam.</th><th>hek</th></tr>${runRijen}</table>
      </div><div>
        <h4>Proefwerken · gemiddelde over ${(t.bladen||[]).length} bladen · per run</h4>
        <svg viewBox="0 0 1000 215">${banden}${assen}${lijn}</svg>
        <h4>Gebeurtenissen · laatste ${Math.min(16,(t.gebeurtenissen||[]).length)}</h4>${geb}
      </div></div>` };
  const haalTijdlijn=()=>{ if(TIJDLIJN&&Date.now()-tijdlijnTijd<300000) return tekenVerslag(); haal('/tijdlijn.json',d=>{ TIJDLIJN=d; tijdlijnTijd=Date.now(); tekenVerslag() }) };
  $('wereld').addEventListener('click',()=>{ verslagOpen=!verslagOpen; tekenVerslag(); if(verslagOpen) haalTijdlijn() });
  $('verslag').addEventListener('click',e=>{ if(e.target.closest('.kop')){ verslagOpen=false; tekenVerslag() } });
  if(verslagOpen){ tekenVerslag(); haalTijdlijn() }


  // Cley antwoordt terug (zoals in de Sterrenwacht): knoppen of vrije tekst → /antwoord-cley; één antwoord per 4 s
  let antwoordSlot=0;
  const antwoordCley=async(a)=>{ a=(a||'').trim(); if(!a) return; if(Date.now()<antwoordSlot){ $('ged-voet').textContent='even wachten \u2014 je antwoord is net verstuurd'; return } antwoordSlot=Date.now()+4000; voetTot=Date.now()+8000;
    const kn=document.querySelectorAll('#ged-knoppen button'); kn.forEach(k=>k.disabled=true); setTimeout(()=>kn.forEach(k=>k.disabled=false),4000);
    $('ged-voet').textContent='versturen\u2026';
    try{ const r=await (await fetch('/antwoord-cley?antwoord='+encodeURIComponent(a),{cache:'no-store'})).json();
      if(r.geantwoord){ $('ged-vrij').value=''; $('ged-voet').textContent='bezorgd: \u201c'+a+'\u201d'; setTimeout(stand,1500) } else $('ged-voet').textContent='er staat geen vraag van haar open' }
    catch(e){ $('ged-voet').textContent='niet gelukt \u2014 probeer nog eens' } };
  document.querySelectorAll('#ged-knoppen button').forEach(b=>b.addEventListener('click',()=>antwoordCley(b.dataset.a)));
  $('ged-vrij').addEventListener('keydown',e=>{ if(e.key==='Enter') antwoordCley($('ged-vrij').value) });
  setInterval(()=>{ const n=new Date(); $('klok').textContent=n.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    if(tempo.op){ $('run-stap').textContent=nl(Math.floor(stapNu())) } zetGeheugen();
    $('status').textContent=Date.now()-laatsteStand>20000?'geen verbinding met de Z490':(LIVE&&Date.now()-liveLaatst<5000?'live · ze denkt':'live · Z490'); },1000);
})();
</script></body></html>
