<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amber — oren</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #080b1e; color: #d8dde5; padding: 18px 16px 40px;
         font-family: system-ui, -apple-system, sans-serif; max-width: 560px;
         margin: 0 auto; padding-top: calc(18px + env(safe-area-inset-top)); }
  h1 { font-size: 15px; letter-spacing: .3em; color: #5f6f92;
       text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
  p { color: #8ea0c0; font-size: 13.5px; line-height: 1.6; margin: 8px 0; }
  .knop { display: block; width: 100%; padding: 16px; margin: 14px 0;
          background: #131b3e; color: #cfe2ff; border: 1px solid #2c3a5e;
          border-radius: 12px; font-size: 16px; cursor: pointer;
          text-align: center; }
  .knop.opnemen { background: #3d1a24; border-color: #7a2f3f; }
  .knop:disabled { opacity: .45; }
  #status { font-size: 13px; color: #7fe0c3; min-height: 1.4em; margin: 6px 0; }
  .kaart { background: #0c1230; border: 1px solid #1d2b4d; border-radius: 12px;
           padding: 13px 15px; margin: 10px 0; }
  .kaart .tijd { font-size: 11px; color: #51608a;
                 font-family: ui-monospace, monospace; }
  .kaart .tekst { font-size: 14.5px; color: #d8dde5; line-height: 1.55;
                  margin-top: 4px; }
  .kop { font-size: 10.5px; letter-spacing: .18em; color: #51608a;
         text-transform: uppercase; margin: 20px 0 6px; }
</style>
</head>
<body>
<h1>Amber — oren</h1>
<p>Spreek iets in en zij maakt er tekst van. Op de iPhone: neem op met
Dictafoon en kies het bestand hieronder (Safari staat een microfoon alleen
op https toe).</p>

<button class="knop opnemen" id="opneem" style="display:none">● opnemen</button>
<label class="knop" for="bestand">bestand kiezen (Dictafoon, spraakmemo…)</label>
<input type="file" id="bestand" accept="audio/*" style="display:none">
<div id="status"></div>

<div class="kop">wat ze verstond</div>
<div id="gehoord"><p style="color:#51608a">nog niets gehoord…</p></div>

<script>
const status = (t) => document.getElementById("status").textContent = t;

async function stuur(blob, naam) {
  status("versturen…");
  await fetch(`/upload?naam=${encodeURIComponent(naam)}`,
              {method: "PUT", body: blob});
  status("verstuurd — ze luistert… (het verstaan kost een halve minuut)");
}

// direct opnemen waar de browser het toestaat (https of Mac)
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia
    && window.MediaRecorder && (location.protocol === "https:"
    || ["localhost", "127.0.0.1"].includes(location.hostname))) {
  const k = document.getElementById("opneem");
  k.style.display = "block";
  let rec = null, stukken = [];
  k.onclick = async () => {
    if (rec && rec.state === "recording") { rec.stop(); return; }
    const stroom = await navigator.mediaDevices.getUserMedia({audio: true});
    stukken = [];
    rec = new MediaRecorder(stroom);
    rec.ondataavailable = (e) => stukken.push(e.data);
    rec.onstop = () => {
      stroom.getTracks().forEach(t => t.stop());
      k.textContent = "● opnemen";
      stuur(new Blob(stukken, {type: rec.mimeType}),
            `opname-${Date.now()}.webm`);
    };
    rec.start();
    k.textContent = "■ stop en verstuur";
    status("aan het opnemen…");
  };
}

document.getElementById("bestand").onchange = (e) => {
  const f = e.target.files[0];
  if (f) stuur(f, `opname-${Date.now()}-${f.name}`);
};

let laatste = "";
async function haal() {
  try {
    const r = await fetch("/rapport/gehoord.json", {cache: "no-store"});
    if (!r.ok) return;
    const d = await r.json();
    if (JSON.stringify(d) === laatste) return;
    laatste = JSON.stringify(d);
    const el = document.getElementById("gehoord");
    el.innerHTML = (d.gehoord || []).slice().reverse().map(g =>
      `<div class="kaart"><div class="tijd">${g.tijd} · ${g.bestand}</div>
       <div class="tekst">${g.tekst}</div></div>`).join("")
      || '<p style="color:#51608a">nog niets gehoord…</p>';
  } catch (e) {}
}
haal(); setInterval(haal, 3000);
</script>
</body>
</html>
